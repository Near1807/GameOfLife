# GameLife backend settings. Game rules and numbers are NOT here: see config/gamelife.json.
# Paths are relative to the folder you start the backend from (normally backend/).

server.port=8080
# Listen on all interfaces so the phone can reach the laptop over the local network.
server.address=0.0.0.0

gamelife.config-path=../config/gamelife.json
gamelife.content-dir=../content
gamelife.db-path=../data/gamelife.db
# Where settings.json and the default backups folder live (the desktop app uses %APPDATA%/GameLife).
gamelife.data-dir=../data
gamelife.frontend-dist=../frontend/dist

# Serve the built frontend on the same port as the API (one address for the phone).
spring.web.resources.static-locations=file:${gamelife.frontend-dist}/

# Create the tables at startup (CREATE TABLE IF NOT EXISTS, see schema.sql).
spring.sql.init.mode=always

# Allow backup files up to 50 MB.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# The PWA manifest needs its own content type to be installable.
server.mime-mappings.webmanifest=application/manifest+json

# Testing aid only: shift the server clock by N hours to see "the morning after" without waiting.
# Never use it on your real data: the boss would attack for the skipped days.
gamelife.clock-offset-hours=0

# Desktop shell only: a random secret that allows POST /api/system/shutdown (empty = endpoint off).
gamelife.shutdown-token=
