<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>GameLife</title>
<style>
  html, body { margin: 0; height: 100%; background: #06070c; color: #eef0fb; font: 15px system-ui, 'Segoe UI', sans-serif; }
  body { display: grid; place-items: center; }
  .box { text-align: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22d3ee; display: inline-block; margin: 0 4px; animation: b 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: .2s; background: #8b5cf6; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes b { to { opacity: .2; transform: translateY(-4px); } }
  p { color: #a7acc9; }
</style>
</head>
<body><div class="box"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<h2>GameLife</h2><p>Starting… missed waves are worked out now.</p></div></body>
</html>
