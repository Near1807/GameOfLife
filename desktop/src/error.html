<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>GameLife could not start</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #06070c; color: #eef0fb; font: 15px system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 640px; margin: 10vh auto; padding: 24px; border: 1px solid rgba(251,191,36,.45); border-radius: 16px; background: rgba(22,24,38,.8); }
  h1 { font-size: 22px; color: #fbbf24; margin-top: 0; }
  code { display: block; padding: 10px; border-radius: 8px; background: #11131f; word-break: break-all; color: #a7acc9; }
  button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(160,170,255,.22); background: #202338; color: #eef0fb; cursor: pointer; margin-right: 8px; }
  p { color: #a7acc9; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>GameLife could not start</h1>
  <p id="message"></p>
  <p>Your data is safe: it is in your data folder, not in the program. The log below says what went wrong; it helps to send it along with a bug report.</p>
  <code id="log"></code>
  <p><button id="open">Show the log file</button><button id="quit">Close GameLife</button></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('message').textContent = q.get('message') || 'Unknown error.';
  document.getElementById('log').textContent = q.get('log') || '(no log file)';
  document.getElementById('open').onclick = () => window.gamelifeDesktop && window.gamelifeDesktop.openLog();
  document.getElementById('quit').onclick = () => window.gamelifeDesktop && window.gamelifeDesktop.quit();
</script>
</body>
</html>
