# Builds the Windows installer (desktop brief 7) on a Windows runner and, for a version tag
# (v0.4.1, ...), attaches it to a GitHub release. Also runs every test on Windows, including the
# desktop shell tests (server start/stop, local-only port, offline, jlink runtime, Electron e2e).
#
# Start it: push a tag (git tag v0.4.1 && git push origin v0.4.1), or "Run workflow" in the
# Actions tab (then the installer is only an artifact of the run, not a release).
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release and attach the .exe

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Backend and frontend tests
        run: npm test

      - name: Build the app (content check, frontend, backend jar)
        run: npm run build

      - name: Desktop shell tests (server, local-only port, data folder, offline, runtime, Electron)
        run: npm test --prefix desktop

      - name: Build the installer (icon, staging, jlink runtime, NSIS)
        run: npm run dist --prefix desktop

      - uses: actions/upload-artifact@v4
        with:
          name: GameLife-Setup
          path: desktop/dist/GameLife-Setup-*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/GameLife-Setup-*.exe
          fail_on_unmatched_files: true
          body: |
            Windows installer for GameLife ${{ github.ref_name }}.
            Unsigned: Windows SmartScreen shows "Windows protected your PC". Click "More info", then "Run anyway".
            Your data in %APPDATA%\GameLife is kept by installs, updates and uninstalls.
